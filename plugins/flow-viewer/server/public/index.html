<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Viewer</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/boot.js"></script>
</head>
<body>
<header>
  <h1 class="brand">Flow Viewer</h1>
  <button id="proj" type="button" aria-haspopup="true" title="Ganti proyek"><span id="pname"></span></button>
  <nav id="tabs" aria-label="Tampilan">
    <button type="button" data-v="live" aria-pressed="true">Live</button>
    <button type="button" data-v="history" aria-pressed="false">Riwayat</button>
  </nav>
  <span id="conn" class="off"></span><span id="connt">terputus</span>
  <button id="theme" type="button" aria-label="Ganti tema"></button>
  <button id="tchat" type="button" aria-controls="side" aria-expanded="true">Panel</button>
  <button id="more" type="button" aria-haspopup="true" aria-expanded="false" aria-label="Menu lainnya">Lainnya</button>
  <div id="pmenu" hidden><button id="reset" type="button">Reset run</button></div>
</header>
<div id="offline" role="status">Terputus dari server. Menyambung ulang otomatis; data di layar mungkin sudah lama.</div>
<div id="strip"><div id="now" aria-live="polite"></div><span id="verdict"></span></div>
<div id="histbar" role="status" hidden></div>
<main>
  <section id="plist" aria-label="Daftar proyek" hidden></section>
  <section id="stage" class="graph" aria-label="Alur agent">
    <div class="stage-wrap">
      <div class="stage" id="gscroll" tabindex="0" aria-label="Grafik alur agent, bisa digulir"><div id="canvas" class="canvas" role="group" aria-label="Agent dan hubungannya"></div></div>
      <div id="empty" class="g-empty" role="status" hidden></div>
      <div id="zwrap" class="zoom"><button id="zout" type="button" aria-label="Perkecil">−</button><span id="zlbl" class="zlbl">100%</span><button id="zin" type="button" aria-label="Perbesar">+</button><button id="zfit" type="button">Pas layar</button></div>
    </div>
  </section>
  <section id="history" hidden>
    <header><h2>Riwayat</h2><button type="button" data-act="hall">Semua proyek</button><button type="button" data-act="trep" disabled>Laporan token</button></header>
    <div id="hstats"></div>
    <div id="hcmp" hidden></div>
    <div id="htrend"></div>
    <div id="hrows"></div>
  </section>
  <aside id="side" aria-label="Panel samping">
    <div id="pan"><div id="pi"></div></div>
    <div id="drawer" hidden>
      <div id="dhead"></div>
      <div id="dwarn"></div>
      <div id="dans"></div>
      <div id="dnums"></div>
      <div id="dsecs"></div>
    </div>
    <nav id="rail" aria-label="Panel">
      <button type="button" data-v="chat">Percakapan</button>
      <button type="button" data-v="backlog">Backlog</button>
      <button type="button" data-v="files">File</button>
      <button type="button" data-v="skill">Skill</button>
      <button type="button" data-v="token">Token</button>
      <button type="button" data-v="log">Log</button>
    </nav>
  </aside>
</main>
<div id="pop"></div>
<div id="modal" hidden><div id="mc" role="dialog" aria-modal="true" tabindex="-1"></div></div>
<noscript><p>Flow Viewer butuh JavaScript.</p></noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
