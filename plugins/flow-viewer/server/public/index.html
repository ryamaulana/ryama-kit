<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Viewer</title>
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/app.css">
<script src="/boot.js"></script>
</head>
<body>
<header class="top">
  <div class="c brandc"><span class="brand">Flow Viewer</span><button class="proj" id="proj" title="Ganti proyek"><span id="pname">proyek</span><span class="ar">▾</span></button></div>
  <div class="c" id="hb-run"></div>
  <div class="c" id="hb-dur"></div>
  <div class="c" id="hb-prog" title="Berapa langkah alur yang sudah selesai"></div>
  <div class="c tkc" id="tkov" title="Klik untuk detail token per agent"></div>
  <button class="need" id="need" type="button"></button>
  <span class="conn off" id="conn" title="Belum terhubung"><i></i><span id="conntx">terputus</span></span>
  <button class="ib" id="theme" type="button">Gelap</button>
  <button class="ib" id="more" type="button" title="Pengaturan" aria-haspopup="true">⋯</button>
</header>
<div id="pmenu" hidden></div>
<main class="wrap">
  <section id="stage" aria-label="Alur agent"><div id="canvas"><div id="cv"></div></div>
    <div id="empty" class="empty" hidden><b>Belum ada run</b><span>Jalankan sebuah perintah di Claude Code. Alurnya terisi di sini.</span></div>
    <div class="zoom" id="zwrap"><button id="zout" type="button" aria-label="Perkecil">−</button><button id="zfit" type="button">Pas layar</button><button id="zin" type="button" aria-label="Perbesar">+</button><span id="zlbl" hidden></span></div>
    <div class="legend"><span><i style="background:var(--acc)"></i>berjalan</span><span><i style="background:var(--ok)"></i>selesai</span><span><i style="background:var(--warn)"></i>butuh input</span><span><i style="background:var(--wait)"></i>menunggu</span></div>
  </section>
  <aside id="side"><div class="pan" id="pan"><div class="pi" id="pi"></div></div><nav class="rail" aria-label="Panel"><div class="pill2" id="rail"></div></nav></aside>
</main>
<div id="pop"></div><div id="modal"><div class="mc" id="mc"></div></div>
<noscript><p style="padding:20px">Flow Viewer butuh JavaScript.</p></noscript>
<script type="module" src="/js/app.js"></script>
</body>
</html>
