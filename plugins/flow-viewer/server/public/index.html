<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Viewer</title>
<style>
  :root{
    --bg:#12131a; --panel:#1b1d25; --panel2:#222530; --line:#2d3140; --text:#eceef4; --muted:#a3a9bb; --dim:#8e95a9;
    --idle:#566077; --run:#5b9bff; --done:#34d399; --skip:#f5b042; --main:#b794ff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  header h1{font-size:15px;margin:0;font-weight:650}
  .chip{padding:3px 10px;border-radius:999px;font-size:12px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .chip.ok{color:var(--done);border-color:#24705a;background:#13342a}
  .chip.warn{color:var(--skip);border-color:#7a561a;background:#35270c}
  .chip.run{color:var(--run);border-color:#2b5599;background:#14233f}
  .dot{width:8px;height:8px;border-radius:50%;background:#ef5b5b;display:inline-block;margin-right:6px}
  .dot.on{background:var(--done)}
  .spacer{flex:1}
  button{background:#262a37;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
  button:hover{border-color:#47506a}
  main{flex:1;display:flex;min-height:0}
  .left{flex:1;display:flex;flex-direction:column;min-width:0}
  #stage{flex:1;overflow:auto;display:flex;min-height:220px;
    background-image:radial-gradient(#272a37 1px,transparent 1px);background-size:22px 22px}
  #canvas{position:relative;margin:auto;flex:none}
  #canvas.list{width:100%!important;height:auto!important;padding:14px;display:flex;flex-direction:column;gap:10px}
  .lane{position:absolute;border:1px solid #262a38;border-radius:16px;background:rgba(255,255,255,.015)}
  .lane span{position:absolute;left:14px;top:10px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
  svg#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .edge{fill:none;stroke:#4a5268;stroke-width:2}
  .edge.faint{stroke:#2f3444;stroke-width:1.6}
  .edge.active{stroke:var(--run);stroke-width:2.5;stroke-dasharray:7 6;animation:flow .8s linear infinite}
  .edge.done{stroke:var(--done)}
  .edge.disp{stroke:#7a63c4;stroke-width:1.8;stroke-dasharray:3 5}
  @keyframes flow{to{stroke-dashoffset:-13}}
  .node{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px 10px 18px;overflow:hidden;
    box-shadow:0 4px 14px rgba(0,0,0,.28);transition:border-color .2s,box-shadow .2s,opacity .2s;display:flex;flex-direction:column}
  #canvas.list .node{position:relative;width:100%;min-height:128px}
  .node::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--idle)}
  .node.st-running{border-color:var(--run);box-shadow:0 0 0 3px rgba(91,155,255,.20),0 6px 22px rgba(91,155,255,.18);background:#192238;animation:pulse 1.5s ease-in-out infinite}
  .node.st-running::before{background:var(--run)}
  .shim{position:absolute;left:0;right:0;top:0;height:3px;overflow:hidden;display:none}
  .st-running .shim{display:block}
  .shim::after{content:"";position:absolute;top:0;bottom:0;width:40%;background:linear-gradient(90deg,transparent,var(--run),transparent);animation:shim 1.2s linear infinite}
  @keyframes shim{from{left:-40%}to{left:100%}}
  .node.st-done{border-color:#24705a}.node.st-done::before{background:var(--done)}
  .node.st-skipped{border-color:#7a561a;background:#241d10}.node.st-skipped::before{background:var(--skip)}
  .node.st-optional{border-style:dashed;opacity:.6}
  .node.off{opacity:.5}
  .node.kind-main{border-color:#54408a}.node.kind-main::before{background:var(--main)}
  .node.kind-main.st-running{border-color:var(--main);background:#221c36;box-shadow:0 0 0 3px rgba(183,148,255,.18)}
  .node.kind-trigger{background:var(--panel2)}.node.kind-trigger::before{background:#7a8299}
  @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(91,155,255,.07),0 6px 22px rgba(91,155,255,.18)}}
  .nm{font-weight:650;font-size:15px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .nm .n{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pill{margin-left:auto;font-size:11.5px;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:500;white-space:nowrap}
  .st-running .pill{color:#9cc2ff;border-color:#2b5599;background:#16294a}
  .st-done .pill{color:var(--done);border-color:#24705a}
  .st-skipped .pill{color:var(--skip);border-color:#7a561a}
  .kind-main.st-running .pill,.pill.mainwait{color:#cdb6ff;border-color:#54408a}
  .bg{font-size:10.5px;padding:0 6px;border-radius:5px;background:#1d2c4b;color:#9cc2ff;font-weight:700}
  .role{color:var(--muted);font-size:12.5px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .act{margin-top:7px;font:12.5px ui-monospace,Menlo,Consolas,monospace;color:#d5def7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
  .st-done .act,.st-idle .act,.off .act{color:var(--dim)}
  .recent{margin-top:2px;font:11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--dim);line-height:1.5;overflow:hidden}
  .recent div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{margin-top:auto;padding-top:4px;color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden}
  .skills{margin-top:4px;min-height:19px;display:flex;gap:4px;overflow:hidden}
  .skills span{font-size:11px;padding:1px 8px;border-radius:6px;background:#2c2547;color:#d0c1ff;white-space:nowrap}
  .ptext{margin-top:6px;font-size:13px;color:#d6dae6;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  #timeline{border-top:1px solid var(--line);background:var(--panel);padding:8px 16px 10px;max-height:32%;overflow:auto;flex-shrink:0}
  .th{display:flex;align-items:center;gap:14px;margin-bottom:6px;flex-wrap:wrap}
  .th h2,aside h2{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0;font-weight:650}
  .legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .trow{display:flex;align-items:center;gap:10px;height:22px}
  .tname{width:110px;font-size:12px;color:#c3c9d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
  .ttrack{position:relative;flex:1;height:12px;background:#232735;border-radius:4px}
  .tbar{position:absolute;top:0;height:12px;border-radius:4px;background:var(--done);min-width:3px}
  .tbar.run{background:var(--run)}
  .taxis{display:flex;justify-content:space-between;margin-left:120px;color:var(--dim);font-size:11px;margin-top:2px}
  aside{width:330px;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  aside .sec{padding:14px 16px 8px}
  #summary{padding:0 16px 10px;border-bottom:1px solid var(--line);font-size:13px}
  #summary div{margin:3px 0}
  #log{flex:1;overflow:auto;padding:0 8px 12px}
  .ev{display:flex;gap:8px;padding:5px 8px;border-radius:6px;font-size:12.5px}
  .ev:hover{background:#242836}
  .ev time{color:var(--dim);font:11.5px ui-monospace,Menlo,Consolas,monospace;padding-top:1px;flex-shrink:0}
  .k-start{color:#a9c9ff}.k-done{color:#8fe3bf}.k-skill{color:#d0c1ff}.k-flow{color:var(--skip)}.k-prompt{color:#dde0ea}.k-stop,.k-session{color:var(--dim)}

  .node{cursor:pointer}.node:hover{border-color:#5a6486}
  .ico{width:26px;height:26px;border-radius:8px;flex:none;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--c,#566077);background:color-mix(in srgb,var(--c,#566077) 16%,transparent)}
  .ico svg{width:16px;height:16px;fill:none;stroke:var(--c,#aab);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ico.lg{width:38px;height:38px;border-radius:11px}.ico.lg svg{width:22px;height:22px}
  .mchip{font-size:11px;font-weight:650;padding:0 7px;border-radius:6px;border:1px solid;white-space:nowrap}
  .m-opus{color:#f0a6ff;border-color:#6b3a78;background:#2a1830}
  .m-sonnet{color:#9cc2ff;border-color:#2b5599;background:#14233f}
  .m-haiku{color:#8fe3bf;border-color:#24705a;background:#13342a}
  .m-other{color:var(--muted);border-color:var(--line);background:#222530}
  .meta .tok{color:#c3c9d8}
  #drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid #3a4054;box-shadow:-18px 0 40px rgba(0,0,0,.45);display:flex;flex-direction:column;z-index:20;transform:translateX(0);transition:transform .18s}
  #drawer[hidden]{display:flex;transform:translateX(105%);pointer-events:none}
  .dh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .dh h3{margin:0;font-size:17px;font-weight:650}
  .dh .sub{color:var(--muted);font-size:12.5px}
  .dh .x{margin-left:auto;font-size:18px;line-height:1;padding:4px 10px}
  .tabs{display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line)}
  .tab{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:10px 12px}
  .tab.on{color:var(--text);border-bottom-color:var(--run)}
  #dbody{flex:1;overflow:auto;padding:14px 16px 28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px}
  .stat b{display:block;font-size:17px;font-weight:650}
  .stat span{font-size:11.5px;color:var(--muted)}
  .sect{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:650;margin:16px 0 8px}
  .bars .br{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:3px 0}
  .bars .br i{display:block;height:8px;border-radius:4px;background:var(--run);opacity:.8}
  .bars .br em{width:78px;font-style:normal;color:#c3c9d8}
  .tagl{display:flex;flex-wrap:wrap;gap:5px}
  .tagl span{font-size:12px;padding:1px 9px;border-radius:6px;background:#2c2547;color:#d0c1ff}
  .tagl span.def{background:#222530;color:var(--muted)}
  .row{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--panel2);overflow:hidden}
  .rh{display:flex;align-items:center;gap:9px;padding:7px 11px;cursor:pointer;font-size:13px}
  .rh:hover{background:#292d3b}
  .rh time{color:var(--dim);font:11.5px ui-monospace,Consolas,monospace;flex:none}
  .rh .sm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .tb{font-size:11px;font-weight:700;padding:1px 7px;border-radius:5px;flex:none;background:#2a3042;color:#b9c3dd}
  .tb.w{background:#17352b;color:#8fe3bf}.tb.b{background:#33290f;color:#f5c670}.tb.a{background:#2c2547;color:#d0c1ff}.tb.r{background:#172a47;color:#9cc2ff}
  .rs{flex:none;font-size:12px}.rs.ok{color:var(--done)}.rs.error{color:#ef6b6b}.rs.pending{color:var(--dim)}
  .rb{padding:2px 11px 11px;border-top:1px solid var(--line)}
  .rb .lbl{font-size:11px;color:var(--dim);margin:9px 0 4px;text-transform:uppercase;letter-spacing:.06em}
  .path{font:12px ui-monospace,Consolas,monospace;color:#c9d3ee;word-break:break-all}
  pre.out,.diff{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#14161d;border:1px solid var(--line);border-radius:8px;margin:0;overflow:auto;max-height:340px}
  pre.out{padding:8px 10px;white-space:pre-wrap;word-break:break-word;color:#d6dae6}
  .diff div{white-space:pre;padding:0 10px}
  .diff .add{background:rgba(52,211,153,.13);color:#9ae6c4}.diff .del{background:rgba(239,91,91,.13);color:#f5a9a9}
  .plus{color:#8fe3bf;font:12px ui-monospace,Consolas,monospace}.minus{color:#f08b8b;font:12px ui-monospace,Consolas,monospace}
  .newtag{font-size:10.5px;padding:0 6px;border-radius:5px;background:#17352b;color:#8fe3bf;font-weight:700}
  .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .linkbtn{background:none;border:0;padding:0;color:#9cc2ff;text-decoration:underline;cursor:pointer}
  @media (max-width:900px){aside{display:none}}
</style>
</head>
<body>
<header>
  <h1>Flow Viewer</h1>
  <span class="chip" id="flowchip">-</span>
  <span class="chip" id="verdict">menunggu</span>
  <span class="spacer"></span>
  <span class="chip"><span class="dot" id="conn"></span><span id="connt">terputus</span></span>
  <button id="reset">Reset run</button>
</header>
<main>
  <div class="left">
    <div id="stage"><div id="canvas"></div></div>
    <div id="timeline"></div>
  </div>
  <aside>
    <div class="sec"><h2>Ringkasan</h2></div>
    <div id="summary"></div>
    <div class="sec"><h2>Log kejadian</h2></div>
    <div id="log"></div>
  </aside>
</main>
<div id="drawer" hidden>
  <div class="dh" id="dh"></div>
  <div class="tabs" id="dtabs"></div>
  <div id="dbody"></div>
</div>
<script>
const W = 268, H = 158, GX = 64, GY = 34, LY = 46, LP = 16;
const PHASES = [{ col: 0, label: 'Input' }, { col: 1, label: 'Spesifikasi' }, { col: 2, label: 'Bangun' }, { col: 3, label: 'Verifikasi' }];
let S = null, listMode = false;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtMs = (ms) => ms < 1000 ? `${ms}ms` : ms < 60000 ? `${(ms/1000).toFixed(1)}s` : `${Math.floor(ms/60000)}m ${Math.round(ms%60000/1000)}s`;
const hhmmss = (t) => new Date(t).toLocaleTimeString('id-ID', { hour12: false });

const ICONS = {
  prd: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
  architect: '<path d="m12 3-9 5 9 5 9-5z"/><path d="m3 13 9 5 9-5"/>',
  'ui-designer': '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.2-1.6-.4-1 .2-2.4 1.6-2.4H17a4 4 0 0 0 4-4c0-5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="11" cy="7" r="1"/><circle cx="16" cy="8" r="1"/>',
  be: '<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
  fe: '<path d="m8 8-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',
  'ui-critic': '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  qa: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  cyber: '<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  __main: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/>',
  __prompt: '<path d="M4 5h16v11H9l-5 4z"/>',
  __all: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  _def: '<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>'
};
const COLORS = { prd: '#f5b042', architect: '#38bdf8', 'ui-designer': '#f472b6', be: '#34d399', fe: '#60a5fa', 'ui-critic': '#fb923c', qa: '#2dd4bf', cyber: '#f87171', __main: '#b794ff', __prompt: '#8e95a9', __all: '#60a5fa', _def: '#a3a9bb' };
function icon(id, lg) {
  const c = COLORS[id] || COLORS._def;
  return `<span class="ico${lg ? ' lg' : ''}" style="--c:${c}"><svg viewBox="0 0 24 24">${ICONS[id] || ICONS._def}</svg></span>`;
}
const fmtTok = (n) => n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e4 ? Math.round(n / 1e3) + 'k' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0);
function modelOf(n) { return (n && n.usage && n.usage.model) || (n && n.model) || ''; }
function modelChip(m) {
  if (!m) return '';
  const short = m.replace(/^claude-/, '').replace(/-\d{8}$/, '');
  const k = /opus/i.test(m) ? 'opus' : /sonnet/i.test(m) ? 'sonnet' : /haiku/i.test(m) ? 'haiku' : 'other';
  return `<span class="mchip m-${k}">${esc(short)}</span>`;
}
const totalTok = (u) => u ? u.in + u.out + u.cr + u.cc : 0;
const LABEL = { idle: '○ menunggu', running: '● berjalan', done: '✓ selesai', skipped: '⚠ DILEWATI', optional: '○ opsional' };

function layout() {
  const pos = { __prompt: { col: 0, row: 0 }, __main: { col: 0, row: 1 } };
  S.crewMeta.forEach((m) => { pos[m.id] = { col: m.col, row: m.row }; });
  const extras = Object.values(S.nodes).filter((n) => n.extra).map((n) => n.id);
  extras.forEach((id, i) => { pos[id] = { col: 1 + (i % 3), row: 3 + Math.floor(i / 3) }; });
  const xy = {};
  Object.entries(pos).forEach(([id, p]) => { xy[id] = { x: LP + p.col * (W + GX), y: LY + p.row * (H + GY) }; });
  const maxRow = Math.max(...Object.values(pos).map((p) => p.row));
  return { xy, pos, extras, w: LP * 2 + 4 * W + 3 * GX, h: LY + (maxRow + 1) * H + maxRow * GY + LP + 26 };
}

function statusOf(id) {
  if (id === '__prompt') return S.prompt ? 'done' : 'idle';
  if (id === '__main') return S.main.status;
  return S.nodes[id].status;
}

function nodeHtml(id, p) {
  const style = p ? `left:${p.x}px;top:${p.y}px;width:${W}px;height:${H}px` : '';
  if (id === '__prompt') {
    return `<div class="node kind-trigger st-${statusOf(id)}" data-id="__prompt" style="${style}">
      <div class="nm">${icon('__prompt')}<span class="n">Prompt</span>${S.promptAt ? `<span class="pill">${hhmmss(S.promptAt)}</span>` : ''}</div>
      <div class="ptext">${S.prompt ? esc(S.prompt) : '<span style="color:var(--dim)">menunggu prompt...</span>'}</div></div>`;
  }
  if (id === '__main') {
    const m = S.main, running = Object.values(S.nodes).filter((n) => n.status === 'running');
    const waiting = m.status !== 'running' && running.length;
    const pill = m.status === 'running' ? '● bekerja' : waiting ? '… menunggu' : '○ idle';
    const act = m.status === 'running' ? m.last : waiting ? `menunggu: ${running.map((n) => n.id).join(', ')}` : (m.last || '');
    const meta = `${modelChip(m.model)}<span class="tok">${m.usage ? fmtTok(totalTok(m.usage)) + ' tok' : ''}</span><span>${m.tools} tool</span>`;
    return `<div class="node kind-main st-${m.status === 'running' ? 'running' : 'idle'}" data-id="__main" style="${style}"><div class="shim"></div>
      <div class="nm">${icon('__main')}<span class="n">Claude</span><span class="pill${waiting ? ' mainwait' : ''}">${pill}</span></div>
      <div class="role">sesi utama (orchestrator)</div>
      <div class="act">${esc(act)}</div>
      <div class="recent">${m.recent.slice(m.status === 'running' ? 1 : 0, m.status === 'running' ? 2 : 1).map((r) => `<div>${esc(r.text)}</div>`).join('')}</div>
      <div class="meta">${meta}</div>
      <div class="skills">${S.mainSkills.map((s) => `<span>${esc(s)}</span>`).join('')}</div></div>`;
  }
  const a = S.nodes[id];
  const dur = a.status === 'running' ? a.ms + (Date.now() - a.startedAt) : a.ms;
  const rest = [a.count > 1 ? `${a.count}x` : '', dur ? fmtMs(dur) : '', a.tools ? `${a.tools} tool` : '', a.files ? `${a.files} file` : ''].filter(Boolean).join(' · ');
  const meta = `${modelChip(modelOf(a))}${a.usage ? `<span class="tok">${fmtTok(totalTok(a.usage))} tok</span>` : ''}<span>${esc(rest)}</span>`;
  return `<div class="node st-${a.status}${a.offscope ? ' off' : ''}" data-id="${esc(a.id)}" style="${style}"><div class="shim"></div>
    <div class="nm">${icon(a.id)}<span class="n">${esc(a.id)}</span>${a.background ? '<span class="bg">BG</span>' : ''}<span class="pill">${LABEL[a.status] || a.status}</span></div>
    <div class="role">${esc(a.extra ? 'di luar crew' : a.offscope ? 'di luar scope flow ini' : a.role)}</div>
    <div class="act">${esc(a.last)}</div>
    <div class="recent">${a.recent.slice(1, 2).map((r) => `<div>${esc(r.text)}</div>`).join('')}</div>
    <div class="meta">${meta}</div>
    <div class="skills">${a.skills.map((s) => `<span>${esc(s)}</span>`).join('')}</div></div>`;
}


function rounded(pts, r) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [px, py] = pts[i - 1], [cx, cy] = pts[i], [nx, ny] = pts[i + 1];
    const l1 = Math.hypot(cx - px, cy - py), l2 = Math.hypot(nx - cx, ny - cy);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = cx - (cx - px) / l1 * rr, ay = cy - (cy - py) / l1 * rr;
    const bx = cx + (nx - cx) / l2 * rr, by = cy + (ny - cy) / l2 * rr;
    d += ` L${ax},${ay} Q${cx},${cy} ${bx},${by}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}

// Dispatch edges (Claude -> entry agent) go through the empty corridor under the grid so they never cross cards.
function dispatchPath(L, a, b) {
  const pa = L.xy[a], pb = L.xy[b], col = L.pos[b].col;
  const ty = pb.y + H / 2;
  if (col <= 1) { // adjacent column: a plain curve is clean
    const x1 = pa.x + W, x2 = pb.x - 2, mx = (x1 + x2) / 2, y1 = pa.y + H / 2;
    return `M${x1},${y1} C${mx},${y1} ${mx},${ty} ${x2},${ty}`;
  }
  const cy = LY + 2 * (H + GY) + H + GY / 2, gx = pb.x - GX / 2;
  return rounded([[pa.x + W / 2, pa.y + H], [pa.x + W / 2, cy], [gx, cy], [gx, ty], [pb.x - 2, ty]], 14);
}

function edgeList() {
  const edges = [['__prompt', '__main'], ...S.crewEdges];
  const optional = (id) => S.nodes[id] && S.nodes[id].optional;
  const incoming = new Set(S.edges.filter((e) => !optional(e[0])).map((e) => e[1]));
  const roots = S.expected.length ? S.expected.filter((id) => !optional(id) && !incoming.has(id)) : [S.crew[0]];
  const used = Object.values(S.nodes)
    .filter((n) => (n.count > 0 || n.status === 'running') && !roots.includes(n.id) && (S.expected.length ? !S.expected.includes(n.id) : !S.crewEdges.some((e) => e[1] === n.id)))
    .map((n) => n.id);
  [...new Set([...roots, ...used])].forEach((id) => edges.push(['__main', id]));
  return edges;
}

function render() {
  if (!S) return;
  listMode = $('stage').clientWidth < 700;
  const canvas = $('canvas');
  canvas.className = listMode ? 'list' : '';
  const L = layout();
  if (listMode) {
    const ids = ['__prompt', '__main', ...S.crew, ...L.extras];
    canvas.style.width = ''; canvas.style.height = '';
    canvas.innerHTML = ids.map((id) => nodeHtml(id, null)).join('');
  } else {
    canvas.style.width = L.w + 'px'; canvas.style.height = L.h + 'px';
    let html = PHASES.map((p) => `<div class="lane" style="left:${LP + p.col * (W + GX) - 10}px;top:8px;width:${W + 20}px;height:${L.h - 16}px"><span>${p.label}</span></div>`).join('');
    html += `<svg id="edges" width="${L.w}" height="${L.h}"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7590"/></marker></defs>`;
    edgeList().forEach(([a, b]) => {
      const pa = L.xy[a], pb = L.xy[b];
      if (!pa || !pb) return;
      const sa = statusOf(a), sb = statusOf(b);
      const off = (id) => id[0] !== '_' && S.nodes[id] && S.nodes[id].offscope;
      let cls = sb === 'running' ? 'active' : (sa === 'done' && sb === 'done') ? 'done' : '';
      if (a === '__main') cls = sb === 'running' ? 'active' : sb === 'done' ? 'done' : 'disp';
      else if (!cls && (off(a) || off(b) || sb === 'optional' || sb === 'skipped')) cls = 'faint';
      let d;
      if (a === '__main') d = dispatchPath(L, a, b);
      else if (pa.x === pb.x) {
        const x = pa.x + W / 2;
        d = pb.y > pa.y ? `M${x},${pa.y + H} L${x},${pb.y - 2}` : `M${x},${pa.y} L${x},${pb.y + H + 2}`;
      } else {
        const x1 = pa.x + W, y1 = pa.y + H / 2, x2 = pb.x - 2, y2 = pb.y + H / 2, mx = (x1 + x2) / 2;
        d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      }
      html += `<path class="edge ${cls}" d="${d}" marker-end="url(#arr)"/>`;
    });
    html += '</svg>';
    ['__prompt', '__main', ...S.crew, ...L.extras].forEach((id) => { html += nodeHtml(id, L.xy[id]); });
    canvas.innerHTML = html;
  }
  fit(L); summary(); logList(); timeline();
}

function fit(L) {
  const canvas = $('canvas'), stage = $('stage');
  if (listMode || !L) { canvas.style.zoom = 1; return; }
  canvas.style.zoom = 1;
  const z = Math.min(1.35, (stage.clientWidth - 40) / L.w, (stage.clientHeight - 32) / L.h);
  canvas.style.zoom = Math.max(0.5, z);
}
window.addEventListener('resize', () => render());

function timeline() {
  const all = Object.values(S.nodes).filter((n) => n.segments.length);
  const el = $('timeline');
  const head = '<div class="th"><h2>Timeline</h2><div class="legend"><span>○ menunggu</span><span style="color:#9cc2ff">● berjalan</span><span style="color:var(--done)">✓ selesai</span><span style="color:var(--skip)">⚠ dilewati</span><span><b style="color:#9cc2ff">BG</b> background</span></div></div>';
  if (!all.length) { el.innerHTML = head + '<div style="color:var(--dim);font-size:12px">Belum ada agent yang jalan.</div>'; return; }
  const t0 = Math.min(...all.map((n) => n.segments[0].s));
  const t1 = Math.max(Date.now(), ...all.flatMap((n) => n.segments.map((s) => s.e || 0)));
  const span = Math.max(1, t1 - t0);
  const order = all.slice().sort((a, b) => a.segments[0].s - b.segments[0].s);
  el.innerHTML = head + order.map((n) => {
    const bars = n.segments.map((s) => {
      const e = s.e || Date.now();
      return `<div class="tbar ${s.e ? '' : 'run'}" style="left:${(s.s - t0) / span * 100}%;width:${(e - s.s) / span * 100}%"></div>`;
    }).join('');
    return `<div class="trow"><div class="tname" title="${esc(n.id)}">${esc(n.id)}</div><div class="ttrack">${bars}</div></div>`;
  }).join('') + `<div class="taxis"><span>${hhmmss(t0)}</span><span>${fmtMs(span)}</span><span>${hhmmss(t1)}</span></div>`;
}

function summary() {
  const exp = S.expected.map((i) => S.nodes[i]).filter((n) => !n.optional);
  const ran = exp.filter((n) => n.count > 0);
  const missing = exp.filter((n) => n.count === 0);
  const running = Object.values(S.nodes).filter((n) => n.status === 'running');
  const hasFlow = S.expected.length > 0;
  let verdict = 'menunggu', cls = '';
  if (running.length || S.main.status === 'running') { verdict = running.length ? `${running.length} agent berjalan` : 'sesi utama bekerja'; cls = 'run'; }
  else if (S.finished && hasFlow) {
    if (missing.length) { verdict = `${missing.length} langkah dilewati`; cls = 'warn'; } else { verdict = 'flow sesuai'; cls = 'ok'; }
  } else if (S.finished) { verdict = 'selesai'; cls = 'ok'; }
  $('verdict').textContent = verdict; $('verdict').className = 'chip ' + cls;
  $('flowchip').textContent = 'flow: ' + S.flow;
  const skills = [...new Set([...Object.values(S.nodes).flatMap((n) => n.skills), ...S.mainSkills])];
  const files = Object.values(S.nodes).reduce((a, n) => a + n.files, 0);
  let html = '';
  if (hasFlow) {
    html += `<div>Langkah wajib jalan: <b>${ran.length}/${exp.length}</b></div>`;
    if (missing.length && S.finished) html += `<div style="color:var(--skip)">Dilewati: ${missing.map((n) => esc(n.id)).join(', ')}</div>`;
  } else html += '<div style="color:var(--dim)">Mode overview. Jalankan /fullstack-dev:build &lt;scope&gt; buat nyorot flow tertentu.</div>';
  html += `<div>Agent berjalan: ${running.length ? running.map((n) => esc(n.id)).join(', ') : '-'}</div>`;
  const tokAll = Object.values(S.nodes).reduce((a, n) => a + totalTok(n.usage), 0) + totalTok(S.main.usage);
  html += `<div>Token (semua): <b>${tokAll ? fmtTok(tokAll) : '-'}</b></div>`;
  html += `<div>File diubah subagent: <b>${files}</b> · <button class="linkbtn" onclick="openDrawer('__all')">lihat semua file &amp; diff</button></div>`;
  html += '<div style="color:var(--dim);font-size:12px">Klik node mana pun untuk detail (aktivitas, diff, token, hasil).</div>';
  html += `<div>Skill terpanggil: ${skills.length ? skills.map(esc).join(', ') : '<span style="color:var(--dim)">belum ada</span>'}</div>`;
  if (hasFlow) html += '<div style="color:var(--dim);font-size:12px;margin-top:6px">Berhenti untuk approval (mis. mockup) itu normal; langkah setelahnya tampil "dilewati" sampai kamu lanjutkan.</div>';
  $('summary').innerHTML = html;
}

function logList() {
  $('log').innerHTML = S.log.slice(0, 80).map((e) =>
    `<div class="ev"><time>${hhmmss(e.t)}</time><span class="k-${e.kind}">${esc(e.text)}</span></div>`).join('');
}


// ---------- drawer ----------
let dId = null, D = null, dTab = 'ringkas', fetchT = null;
const openEv = new Set();
const toolCls = (t) => /^(Write|Edit|MultiEdit|NotebookEdit)$/.test(t) ? 'w' : t === 'Bash' ? 'b' : /^(Agent|Task|Skill)$/.test(t) ? 'a' : /^(Read|Grep|Glob|WebFetch|WebSearch)$/.test(t) ? 'r' : '';
function diffHtml(oldS, newS) {
  const o = oldS ? String(oldS).replace(/\n$/, '').split('\n').map((l) => `<div class="del">- ${esc(l)}</div>`).join('') : '';
  const n = newS ? String(newS).replace(/\n$/, '').split('\n').map((l) => `<div class="add">+ ${esc(l)}</div>`).join('') : '';
  return `<div class="diff">${o}${n}</div>`;
}
function evBody(r) {
  const i = r.input || {};
  let h = '';
  if (r.tool === 'Edit') h += `<div class="lbl">File</div><div class="path">${esc(i.file || '')}${i.all ? ' (replace all)' : ''}</div>` + diffHtml(i.old, i.new);
  else if (r.tool === 'MultiEdit') h += `<div class="lbl">File</div><div class="path">${esc(i.file || '')}</div>` + (i.edits || []).map((e) => diffHtml(e.old, e.new)).join('<div style="height:6px"></div>');
  else if (r.tool === 'Write') h += `<div class="lbl">File baru / ditimpa · ${i.lines} baris</div><div class="path">${esc(i.file || '')}</div>` + diffHtml('', i.content);
  else if (r.tool === 'NotebookEdit') h += `<div class="lbl">Notebook</div><div class="path">${esc(i.file || '')}</div>` + diffHtml('', i.new);
  else if (r.tool === 'Bash') h += `<div class="lbl">Command${i.bg ? ' (background)' : ''}</div><pre class="out">$ ${esc(i.command || '')}</pre>${i.desc ? `<div class="empty">${esc(i.desc)}</div>` : ''}`;
  else if (r.tool === 'Agent' || r.tool === 'Task') h += `<div class="lbl">Memanggil ${esc(i.agent || '?')}${i.bg ? ' (background)' : ''} · ${esc(i.desc || '')}</div><pre class="out">${esc(i.prompt || '')}</pre>`;
  else if (r.tool === 'Read') h += `<div class="lbl">File</div><div class="path">${esc(i.file || '')}${i.offset ? ` (dari baris ${i.offset}${i.limit ? ', ' + i.limit + ' baris' : ''})` : ''}</div>`;
  else if (r.tool === 'Grep' || r.tool === 'Glob') h += `<div class="lbl">Pencarian</div><pre class="out">${esc(i.pattern || '')}${i.path ? '\n di ' + esc(i.path) : ''}${i.glob ? '\n glob ' + esc(i.glob) : ''}</pre>`;
  else if (r.tool === 'Skill') h += `<div class="lbl">Skill</div><div class="path">${esc(i.skill || '')} ${esc(i.args || '')}</div>`;
  else if (r.tool === 'WebFetch') h += `<div class="lbl">URL</div><div class="path">${esc(i.url || '')}</div>`;
  else if (r.tool === 'WebSearch') h += `<div class="lbl">Query</div><div class="path">${esc(i.query || '')}</div>`;
  else h += `<pre class="out">${esc(i.raw || '')}</pre>`;
  if (r.out) h += `<div class="lbl">Hasil${r.ms != null ? ' · ' + fmtMs(r.ms) : ''}</div><pre class="out">${esc(r.out)}</pre>`;
  return h;
}
function evRow(r, showAgent) {
  const open = openEv.has(r.id);
  const st = r.status === 'ok' ? '✓' : r.status === 'error' ? '✕ gagal' : '…';
  return `<div class="row"><div class="rh" data-ev="${esc(r.id)}"><time>${hhmmss(r.t)}</time><span class="tb ${toolCls(r.tool)}">${esc(r.tool)}</span>${showAgent && r.agent ? `<span class="tb">${esc(r.agent)}</span>` : ''}<span class="sm">${esc(r.summary.replace(/^\w+ /, ''))}</span><span class="rs ${r.status}">${st}</span></div>${open ? `<div class="rb">${evBody(r)}</div>` : ''}</div>`;
}
function filesTab(showAgent) {
  const files = (D.files || []).slice().sort((a, b) => b.edits - a.edits);
  if (!files.length) return '<div class="empty">Belum ada file yang diubah.</div>';
  const byId = Object.fromEntries((D.events || []).map((e) => [e.id, e]));
  return files.map((f) => {
    const key = 'f:' + (f.agent || '') + f.path, open = openEv.has(key);
    const dir = f.path.replace(/[\\/][^\\/]*$/, ''), name = f.path.split(/[\\/]/).pop();
    const evs = f.evIds.map((id) => byId[id]).filter(Boolean);
    return `<div class="row"><div class="rh" data-ev="${esc(key)}"><span class="tb w">${f.created ? 'BARU' : 'EDIT'}</span><span class="sm"><b>${esc(name)}</b> <span style="color:var(--dim)">${esc(dir)}</span></span>${showAgent && f.agent ? `<span class="tb">${esc(f.agent)}</span>` : ''}<span class="plus">+${f.add}</span><span class="minus">−${f.del}</span><span style="color:var(--dim);font-size:12px">${f.edits}x</span></div>${open ? `<div class="rb">${evs.map((e) => `<div class="lbl">${hhmmss(e.t)} · ${esc(e.tool)}</div>${evBody({ ...e, out: '' })}`).join('') || '<div class="empty">Detail diff sudah terpotong dari buffer.</div>'}</div>` : ''}</div>`;
  }).join('');
}
function summaryTab() {
  const n = D.node || {}, u = n.usage;
  const evs = D.events || [];
  const counts = {};
  evs.forEach((e) => { counts[e.tool] = (counts[e.tool] || 0) + 1; });
  const rows = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const mx = rows.length ? rows[0][1] : 1;
  const st = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
  let h = '<div class="grid">';
  h += st(esc(LABEL[n.status] || n.status || '-'), 'status');
  if (n.count != null) h += st(n.count + 'x', 'putaran');
  if (n.ms != null) h += st(n.ms ? fmtMs(n.ms) : '-', 'durasi');
  h += st(evs.length, 'tool dipanggil');
  h += st((D.files || []).length, 'file diubah');
  h += '</div>';
  h += '<div class="sect">Model &amp; token</div><div class="grid">';
  const actual = u && u.model, cfg = n.model;
  h += st(actual ? modelChip(actual) : (cfg ? modelChip(cfg) : '-'), actual ? 'model dipakai (dari transcript)' : cfg ? 'model di definisi agent' : 'model');
  if (u) {
    h += st(fmtTok(u.in), 'input (baru)') + st(fmtTok(u.out), 'output') + st(fmtTok(u.cr), 'cache dibaca') + st(fmtTok(u.cc), 'cache ditulis');
    h += st(fmtTok(totalTok(u)), 'total token') + st(fmtTok(u.ctx), 'konteks terakhir') + st(u.turns, 'giliran model');
  }
  h += '</div>';
  if (!u) h += `<div class="empty">${esc(D.usageNote || 'Token belum tersedia.')}</div>`;
  if (n.desc) h += `<div class="sect">Peran</div><div style="color:#d6dae6;font-size:13px">${esc(n.desc)}</div>`;
  if (n.toolsAllowed) h += `<div class="sect">Tool yang diizinkan</div><div class="tagl">${n.toolsAllowed.split(',').map((t) => `<span class="def">${esc(t.trim())}</span>`).join('')}</div>`;
  const sk = new Set(n.skills || []);
  if ((n.skillsDef || []).length || sk.size) h += `<div class="sect">Skill</div><div class="tagl">${(n.skillsDef || []).map((x) => `<span class="def" title="di-preload lewat definisi agent">${esc(x)}</span>`).join('')}${[...sk].map((x) => `<span title="dipanggil lewat tool Skill">${esc(x)}</span>`).join('')}</div><div class="empty">abu-abu = di-preload di definisi agent, ungu = dipanggil saat berjalan</div>`;
  if (rows.length) h += `<div class="sect">Pemakaian tool</div><div class="bars">${rows.map(([t, c]) => `<div class="br"><em>${esc(t)}</em><i style="width:${Math.max(4, c / mx * 220)}px"></i><span>${c}</span></div>`).join('')}</div>`;
  return h;
}
function taskTab() {
  let h = '';
  h += `<div class="sect">Tugas yang diberikan${D.taskDesc ? ' · ' + esc(D.taskDesc) : ''}</div>` + (D.task ? `<pre class="out">${esc(D.task)}</pre>` : '<div class="empty">Tidak ada (agen ini dipanggil tanpa prompt yang terbaca).</div>');
  h += '<div class="sect">Jawaban akhir</div>' + (D.result ? `<pre class="out">${esc(D.result)}</pre>` : '<div class="empty">Belum ada (agen masih berjalan atau belum selesai).</div>');
  return h;
}
function renderDrawer() {
  if (!D || !dId) return;
  const all = dId === '__all', n = D.node || {};
  $('dh').innerHTML = `${icon(dId, true)}<div><h3>${esc(D.title)}</h3><div class="sub">${esc(all ? 'gabungan semua agent' : n.role || '')}</div></div>${all ? '' : modelChip((n.usage && n.usage.model) || n.model)}<button class="x" onclick="closeDrawer()">×</button>`;
  const tabs = all ? [['files', 'File & diff']] : [['ringkas', 'Ringkasan'], ['aktivitas', `Aktivitas (${(D.events || []).length})`], ['files', `File (${(D.files || []).length})`], ['tugas', 'Tugas & hasil']];
  if (all) dTab = 'files';
  $('dtabs').innerHTML = tabs.map(([k, l]) => `<button class="tab${dTab === k ? ' on' : ''}" data-tab="${k}">${l}</button>`).join('');
  const body = $('dbody'), top = body.scrollTop;
  let h = '';
  if (dTab === 'ringkas') h = summaryTab();
  else if (dTab === 'aktivitas') h = (D.events || []).length ? (D.events.slice().reverse().map((r) => evRow(r, false)).join('')) : '<div class="empty">Belum ada aktivitas tercatat untuk node ini.</div>';
  else if (dTab === 'files') h = filesTab(all);
  else h = taskTab();
  body.innerHTML = h; body.scrollTop = top;
}
function fetchDetail() {
  if (!dId) return;
  fetch('/detail?id=' + encodeURIComponent(dId)).then((r) => r.json()).then((d) => { D = d; renderDrawer(); }).catch(() => {});
}
function openDrawer(id) {
  if (id === '__prompt') return;
  if (dId !== id) { openEv.clear(); dTab = id === '__all' ? 'files' : 'ringkas'; D = null; }
  dId = id; $('drawer').hidden = false; fetchDetail();
}
function closeDrawer() { dId = null; D = null; $('drawer').hidden = true; }
$('canvas').addEventListener('click', (e) => { const n = e.target.closest('.node'); if (n && n.dataset.id) openDrawer(n.dataset.id); });
$('drawer').addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]'); if (t) { dTab = t.dataset.tab; renderDrawer(); return; }
  const r = e.target.closest('[data-ev]'); if (r) { const k = r.dataset.ev; openEv.has(k) ? openEv.delete(k) : openEv.add(k); renderDrawer(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

function connect() {
  const es = new EventSource('/stream');
  es.onopen = () => { $('conn').classList.add('on'); $('connt').textContent = 'terhubung'; };
  es.onmessage = (m) => { S = JSON.parse(m.data); render(); if (dId) { clearTimeout(fetchT); fetchT = setTimeout(fetchDetail, 500); } };
  es.onerror = () => { $('conn').classList.remove('on'); $('connt').textContent = 'terputus'; };
}
$('reset').onclick = () => fetch('/reset', { method: 'POST' });
setInterval(() => { if (S && Object.values(S.nodes).some((n) => n.status === 'running')) render(); }, 1000);
connect();
</script>
