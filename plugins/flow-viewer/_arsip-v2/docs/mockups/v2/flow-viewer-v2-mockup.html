<!doctype html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Viewer v2 — mockup</title>
<script>try{var t=localStorage.getItem('fv2-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{
  --bg:#f4f4f4;--dot:#d6d6d6;--card:#ffffff;--line:#e4e4e4;--ink:#1a1a1a;--ink2:#5c5c5c;--ink3:#8a8a8a;
  --acc:#1e63d6;--accbg:#e4edfb;--ok:#15803d;--okbg:#e6f3ea;--warn:#c2680a;--warnbg:#fbf0dd;--bad:#d1291f;--badbg:#fbe9e6;
  --wait:#8a8a8a;--waitbg:#ececec;--edge:#bcbcbc;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);--panel:#ffffff;
}
:root[data-theme=dark]{
  --bg:#121212;--dot:#262626;--card:#1b1b1b;--line:#2b2b2b;--ink:#ededed;--ink2:#a6a6a6;--ink3:#767676;
  --acc:#5b9cff;--accbg:#14263f;--ok:#4ade80;--okbg:#12281c;--warn:#fbbf24;--warnbg:#2e2410;--bad:#f87171;--badbg:#2f1717;
  --wait:#8a8a8a;--waitbg:#262626;--edge:#434343;--shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);--panel:#161616;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{white-space:nowrap;height:56px;flex:none;display:flex;align-items:center;gap:20px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em}
.flow{max-width:190px;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:var(--ink2);background:var(--waitbg);padding:3px 10px;border-radius:99px}
.stats{display:flex;gap:6px;margin-left:8px}
.stat{display:flex;align-items:baseline;gap:7px;padding:6px 14px;border-radius:10px}
.stat b{font-size:17px;font-weight:650;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.stat+.stat{border-left:1px solid var(--line);border-radius:0;padding-left:20px}
.bar{width:84px;height:5px;border-radius:9px;background:var(--waitbg);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:var(--acc);width:50%}
.sp{flex:1}
.need{display:none;align-items:center;gap:8px;background:var(--warnbg);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);padding:6px 13px;border-radius:99px;font-weight:600;font-size:13px}
.need.on{display:inline-flex}
.need::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.6s infinite}
.ib{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:13px;color:var(--ink2)}
.ib:hover{color:var(--ink);border-color:var(--ink3)}
.ib.on{background:var(--accbg);color:var(--acc);border-color:transparent}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.conn i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wrap{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:22px 22px}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
svg#ed{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.col{position:absolute;top:0;width:300px}
.col h4{margin:0 0 14px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.node{position:absolute;width:300px;height:124px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;transition:border-color .15s,transform .15s}
.node:hover{border-color:var(--ink3)}
.node.sel{border-color:var(--acc);box-shadow:0 0 0 3px var(--accbg),var(--shadow)}
.node.run{border-color:var(--acc)}
.node.run::after{content:"";position:absolute;inset:-1px;border-radius:14px;border:1.5px solid var(--acc);animation:ring 2s infinite;pointer-events:none}
.nh{display:flex;align-items:center;gap:10px}
.ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--waitbg);color:var(--ink2);flex:none}
.ico svg{width:16px;height:16px}
.run .ico{background:var(--accbg);color:var(--acc)}
.done .ico{background:var(--okbg);color:var(--ok)}
.nm{font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap}
.rl{font-size:11.5px;color:var(--ink3)}
.pill{margin-left:auto;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--waitbg);color:var(--wait);white-space:nowrap}
.run .pill{background:var(--accbg);color:var(--acc)}
.done .pill{background:var(--okbg);color:var(--ok)}
.fail .pill{background:var(--badbg);color:var(--bad)}
.ask .pill{background:var(--warnbg);color:var(--warn)}
.act{margin:10px 0 0;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act code{font:12px ui-monospace,Consolas,monospace;background:var(--waitbg);padding:1px 6px;border-radius:5px;color:var(--ink)}
.nf{white-space:nowrap;display:flex;gap:12px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.nf span{white-space:nowrap}.nf b{color:var(--ink2);font-weight:600}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.zoom button{border:0;background:none;padding:6px 11px;font-size:13px;color:var(--ink2)}
.zoom button:hover{background:var(--waitbg)}
.legend{position:absolute;right:196px;bottom:16px;display:flex;gap:14px;font-size:11.5px;color:var(--ink3);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
aside{display:flex;flex:none}
.pan{width:0;overflow:hidden;background:var(--panel);border-left:1px solid var(--line);transition:width .2s ease}
.pan.open{width:420px}
.pan .pi{width:420px;height:100%;overflow:auto;padding:16px}
.pan h2{margin:0 0 2px;font-size:16px;display:flex;align-items:center;gap:8px}
.pan h2 small{margin-left:auto;font-size:12px;color:var(--ink2);font-weight:500}
.pan h2 button{margin-left:6px;border:0;background:none;color:var(--ink3);font-size:18px;line-height:1;padding:2px 6px}
.pan .sub{margin:2px 0 14px}
.rail{width:72px;flex:none;display:flex;align-items:center;justify-content:center;padding:14px 0;background:var(--bg);border-left:1px solid var(--line)}
.rail .pill2{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:30px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.rail button{position:relative;width:56px;height:52px;border:0;border-radius:14px;background:none;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.rail button .rl2{font-size:10px;letter-spacing:.02em}
.rail button:hover{background:var(--waitbg);color:var(--ink)}
.rail button.on{background:var(--accbg);color:var(--acc)}
.rail button svg{width:19px;height:19px}
.rail button em{position:absolute;top:0;right:2px;min-width:17px;height:17px;border-radius:99px;background:var(--waitbg);color:var(--ink2);border:1px solid var(--line);font:600 10px/15px inherit;font-style:normal;text-align:center;padding:0 5px}
.rail button em.w{background:var(--warn);color:#fff;border-color:var(--warn)}
.rail .ln{width:22px;height:1px;background:var(--line);margin:2px 0}
.tkmini{display:flex;height:7px;width:110px;border-radius:9px;overflow:hidden;background:var(--waitbg);align-self:center;cursor:pointer;margin-left:4px}
.tkmini i{display:block;height:100%}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.sec>header{height:auto;border:0;background:none;padding:12px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.sec>header b{font-size:13.5px;font-weight:650}
.sec>header small{margin-left:auto;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums}
.sec>header i{width:7px;height:7px;border-right:1.6px solid var(--ink3);border-bottom:1.6px solid var(--ink3);transform:rotate(45deg);margin:-3px 0 0 4px;transition:transform .15s}
.sec.shut>header i{transform:rotate(-45deg);margin-top:0}
.sec .in{padding:0 14px 14px}
.sec.shut .in{display:none}
.sec.q{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.sec.flash{animation:fl 1s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accbg)}100%{box-shadow:var(--shadow)}}
.big{font-size:24px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big span{font-size:12.5px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:6px}
.ag{padding:9px 0;border-top:1px solid var(--line)}
.ag:first-of-type{border-top:0}
.ag .l{display:flex;align-items:center;gap:8px;font-size:13px}
.ag .l .r{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.ag .m{font-size:11.5px;color:var(--ink3);margin:3px 0 0 16px;font-variant-numeric:tabular-nums}
.ag .pb{height:4px;border-radius:9px;background:var(--waitbg);margin:6px 0 0 16px;overflow:hidden}
.ag .pb i{display:block;height:100%;border-radius:9px}
.note{font-size:11.5px;color:var(--ink3);margin-top:8px}
.body{display:none}
.pg{display:none}.pg.on{display:block}
h3{margin:0 0 4px;font-size:15px}
.sub{color:var(--ink2);font-size:12.5px;margin-bottom:14px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.box.q{background:var(--warnbg);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.box small{color:var(--ink3);display:block;margin-bottom:3px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border:0}.kv span{color:var(--ink2)}
.msg{margin-bottom:10px;font-size:13px}
.msg .w{font-size:11px;color:var(--ink3);margin-bottom:2px}
.msg.u .t{background:var(--accbg);border-radius:10px;padding:8px 11px;display:inline-block}
.tb{height:8px;border-radius:9px;background:var(--waitbg);overflow:hidden;display:flex;margin:6px 0 12px}
.tb i{display:block;height:100%}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13px;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .r{margin-left:auto;color:var(--ink3);font-size:12px;font-variant-numeric:tabular-nums}
.dt{width:8px;height:8px;border-radius:50%;flex:none}
.mono{font:12px ui-monospace,Consolas,monospace}
@keyframes pulse{50%{opacity:.35}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
@keyframes dash{to{stroke-dashoffset:-20}}
path.live{stroke-dasharray:5 5;animation:dash 1s linear infinite;stroke:var(--acc)!important}
.tkov{flex:none;display:flex;align-items:center;gap:22px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.tkov:hover{background:color-mix(in srgb,var(--card) 90%,var(--waitbg))}
.tkov .tt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-bottom:1px}
.tkov .bg{font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.tkov .bg span{font-size:12.5px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-left:6px}
.tkov .mid{flex:1;min-width:0}
.tkov .bar2{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--waitbg)}
.tkov .bar2 i{display:block;height:100%}
.tkov .lg{display:flex;gap:18px;margin-top:7px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.tkov .lg span{display:inline-flex;align-items:center;gap:6px}
.tkov .lg i{width:8px;height:8px;border-radius:3px;flex:none}
.tkov .go{font-size:12px;color:var(--acc);white-space:nowrap}
header.top{height:auto;min-height:68px;padding:8px 20px;gap:0;align-items:stretch}
header.top .c{flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 14px;max-width:250px;border-left:1px solid var(--line);min-width:0}
header.top .c.brandc{border:0;padding-left:0;gap:5px;align-items:flex-start}
header.top .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
header.top .v{font-size:12.5px;color:var(--ink2);white-space:nowrap}
header.top .v b{font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:3px}
header.top .d{font-size:11.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .tkc{flex:1 1 0;cursor:pointer;min-width:300px;max-width:none;overflow:hidden}
header.top .tkc:hover .v b{color:var(--acc)}
header.top .bar2{display:flex;height:8px;border-radius:9px;overflow:hidden;background:var(--waitbg);margin-top:5px}
header.top .bar2 i{display:block;height:100%}
header.top .lg{display:flex;gap:14px;margin-top:4px;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
header.top .lg span{display:inline-flex;align-items:center;gap:5px}
header.top .lg i{width:7px;height:7px;border-radius:2px;flex:none}
header.top>.need{margin-left:12px;flex:none;font-size:12.5px;padding:6px 11px}header.top .d{max-width:none}header.top>.need,header.top>.conn,header.top>.ib{align-self:center;margin-left:12px}
.hs{display:flex;align-items:center;gap:6px;margin:16px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.hs small{font-size:11px}
.chs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.ch{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--waitbg);color:var(--ink2);white-space:nowrap}
.ch.w{background:var(--warnbg);color:var(--warn)}.ch.ok{background:var(--okbg);color:var(--ok)}.ch.acc{background:var(--accbg);color:var(--acc)}
.bi{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.bi:last-child{border:0}.bi .dt{margin-top:6px}.bi>div{flex:1;min-width:0}.bi .ch{margin-left:auto;flex:none}.bi .r{margin-left:auto;color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.d2{font-size:12px;color:var(--ink3);margin-top:1px}
.opt{margin-top:8px;padding:8px 12px;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:10px;font-size:13px;background:var(--card);color:var(--ink)}
.msg.tl{color:var(--ink3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid2 .box{margin:0}.grid2 b{font-size:17px}
.tlx{font-size:12.5px;color:var(--ink2)}.tlx>div{padding:6px 0 6px 12px;border-left:2px solid var(--line);margin-left:3px}
.tlx .mono{color:var(--ink3);margin-right:4px}
.lg2>div{line-height:1.9}

.node .ico{width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--rc,#888) 15%,var(--card));color:var(--rc,var(--ink2));position:relative;flex:none}
.node .ico svg{width:20px;height:20px}
.sb{position:absolute;right:-5px;bottom:-5px;width:17px;height:17px;border-radius:50%;border:2px solid var(--card);font:700 10px/13px inherit;font-style:normal;color:#fff;text-align:center;display:none}
.sb.done{display:block;background:var(--ok)}.sb.run{display:block;background:var(--acc);animation:spin 1.1s linear infinite}
.sb.ask{display:block;background:var(--warn)}.sb.fail{display:block;background:var(--bad)}.sb.skip{display:block;background:var(--wait)}
@keyframes spin{to{transform:rotate(360deg)}}
.port{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--card);border:2px solid var(--edge)}
.port.l{left:-6px}.port.r{right:-6px}
.node.run .port,.node.done .port{border-color:var(--ok)}.node.run .port{border-color:var(--acc)}
.node.fail{border-color:var(--bad)}.node.fail .port{border-color:var(--bad)}
.node.ask{border-color:var(--warn)}
.node.skip{opacity:.6;border-style:dashed}
.node.wait{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.need.bad{background:var(--badbg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}.need.bad::before{background:var(--bad)}
.need.ok{background:var(--okbg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}.need.ok::before{background:var(--ok);animation:none}
.proj{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:3px 10px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.proj:hover{border-color:var(--ink3)}
.dl{font-size:11.5px;color:var(--ok);margin-left:6px;font-weight:600}.dl.up{color:var(--warn)}
#pop{position:fixed;z-index:50;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:6px;display:none}

.sw{width:30px;height:17px;border-radius:99px;background:var(--waitbg);position:relative;margin-left:auto;flex:none}

#modal .mc{width:560px;max-width:92vw;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
#modal h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:10px}

#modal .g3 .box{margin:0}#modal .g3 b{font-size:20px}
.stsw{border-style:dashed!important;position:absolute;left:50%;top:12px;z-index:5;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow);font-size:12px;color:var(--ink3);white-space:nowrap}

.stsw .tt{padding-left:8px;border-left:1px solid var(--line);color:var(--ink2)}
.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}

.node{width:210px;height:auto!important;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important;opacity:1!important}
.node.run::after,.node::after{display:none!important}

.node:hover .tile{transform:translateY(-2px)}

 h+=`<div class="pb"><i style="width:${x.p*3.4}%;background:${x.c}"></i></div><div class="m">${x.m} · ${x.tn} giliran · cache ${x.cr} baca / ${x.cc} tulis</div>`;
 if(open){
  h+=`<div class="ctxb"><div class="ctxh"><b>${pct}% konteks terpakai</b><span>${fk(used)} / ${d.win}k</span></div><div class="tb ctxbar">${Object.keys(CAT).map(k=>`<i style="width:${d.p[k]/d.win*100}%;background:${CAT[k][1]}" title="${CAT[k][0]}"></i>`).join('')}</div>`
  +Object.keys(CAT).map(k=>`<div class="crow"><i class="sq" style="background:${CAT[k][1]}"></i><span>${CAT[k][0]}</span><b>${fk(d.p[k])}</b><em>${(d.p[k]/d.win*100).toFixed(1).replace('.',',')}%</em></div>`).join('')

  +d.skills.map(k=>`<div class="crow"><i class="sq" style="background:${CAT.skl[1]}"></i><span>skill <b style="font-weight:600">${k[0]}</b></span><b>${fk(k[1])}</b><em style="color:${k[2]?'var(--ok)':'var(--warn)'}">${k[2]?'terpanggil':'belum'}</em></div>`).join('')
